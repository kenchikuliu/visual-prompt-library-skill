name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a package dry-run or publish to npm"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - publish
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
      PUBLISH_REQUESTED: ${{ github.event_name == 'release' || inputs.mode == 'publish' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11

      - name: Show package
        run: |
          node --version
          npm --version
          npm pkg get name version

      - name: Check installer and prompt search
        run: npm run check

      - name: Dry-run package contents
        run: npm publish --dry-run --access public

      - name: Publish with NPM_TOKEN
        if: env.PUBLISH_REQUESTED == 'true' && env.NPM_TOKEN != ''
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish with npm trusted publishing
        if: env.PUBLISH_REQUESTED == 'true' && env.NPM_TOKEN == '' && env.NPM_TRUSTED_PUBLISHING == 'true'
        run: npm publish --access public

      - name: Skip npm publish without credentials
        if: env.PUBLISH_REQUESTED == 'true' && env.NPM_TOKEN == '' && env.NPM_TRUSTED_PUBLISHING != 'true'
        run: |
          echo "npm publish skipped: add NPM_TOKEN or set repository variable NPM_TRUSTED_PUBLISHING=true after configuring npm trusted publishing."
